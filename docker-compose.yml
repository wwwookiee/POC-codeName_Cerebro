services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cerebro
      POSTGRES_PASSWORD: cerebro
      POSTGRES_DB: cerebro
    ports:
      # Loopback uniquement : le port n'est ouvert que pour psql en local.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cerebro -d cerebro"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://cerebro:cerebro@db:5432/cerebro
      # Facultative : la clé peut aussi être collée dans l'interface (page « Clé API »).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGINS: '["http://localhost:3000"]'
      # Le conteneur tourne en root : sans ça, son bytecode atterrit dans les
      # répertoires montés ci-dessous, en fichiers root que l'hôte ne peut plus
      # supprimer sans sudo.
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app
      # Monté au même titre que le code : sans ça, l'image embarque les
      # migrations telles qu'elles étaient au build, et toute nouvelle révision
      # exige un rebuild avant de pouvoir s'appliquer.
      - ./backend/migrations:/app/migrations
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  pgdata:
