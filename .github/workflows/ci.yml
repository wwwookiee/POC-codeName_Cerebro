name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

# Une nouvelle poussée sur une branche annule la série en cours : seul le
# dernier état a besoin d'être vérifié.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # La clé est facultative à l'import, mais les tests du pipeline
      # construisent un client OpenAI : une valeur factice leur suffit. Le
      # client n'est construit qu'à l'appel et aucun test ne touche au réseau.
      OPENAI_API_KEY: cle-factice-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Aligné sur backend/Dockerfile (python:3.12-slim).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Aligné sur frontend/Dockerfile (node:22-alpine).
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      # `typecheck` lance `next typegen` d'abord : les types globaux de Next 16
      # (PageProps, LayoutProps) sont générés dans .next/types, qui est ignoré
      # par git. Sans eux, tsc échoue sur un dépôt fraîchement cloné.
      - name: Typecheck
        run: npm run typecheck

      # Aucune variable d'environnement : lib/api.ts retombe sur une valeur par
      # défaut, donc rien ne lève. On ne fixe surtout pas NEXT_PUBLIC_API_URL,
      # qui serait figée dans le bundle — ce job ne produit pas d'artefact
      # destiné au déploiement.
      - name: Build
        run: npm run build
